<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tulipa Beat 🐶🎵</title>
<style>
  :root{
    --bg1:#ffe9ef; --bg2:#ffd0de; --ink:#4a2a3a; --pink:#ff5d8f; --blue:#5ab8ff; --yellow:#ffc531;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation}
  body{
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);
    background:
      radial-gradient(circle at 15% 20%, #fff7 0 8%, transparent 9%),
      radial-gradient(circle at 85% 70%, #fff6 0 12%, transparent 13%),
      linear-gradient(160deg,var(--bg1),var(--bg2));
    display:flex;justify-content:center;align-items:flex-end;
  }
  /* decoração de fundo */
  .bgdots{position:fixed;inset:0;background-image:radial-gradient(#ff5d8f22 2px,transparent 2.5px);background-size:34px 34px;pointer-events:none}

  #stage{
    position:relative;
    height:min(100dvh, 100vw * 431 / 375);
    aspect-ratio:375/431;
    max-height:100dvh;
  }
  #wrap{position:absolute;inset:0;transform-origin:50% 100%}
  #dog{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;transform-origin:50% 100%;
       filter:drop-shadow(0 8px 10px #0003)}

  /* animações da cachorrinha */
  @keyframes talk{
    0%{transform:rotate(0) translateY(0) scale(1,1)}
    20%{transform:rotate(-2.2deg) translateY(-1.5%) scale(1.01,.995)}
    40%{transform:rotate(1.8deg) translateY(0) scale(.99,1.01)}
    60%{transform:rotate(-1.5deg) translateY(-1%) scale(1.01,.995)}
    80%{transform:rotate(2deg) translateY(0) scale(1,1)}
    100%{transform:rotate(0) translateY(0) scale(1,1)}
  }
  #wrap.talk{animation:talk .42s ease-in-out infinite}
  @keyframes idle{0%,100%{transform:scale(1,1)}50%{transform:scale(1.008,1.012)}}
  #wrap.idle{animation:idle 1.2s ease-in-out infinite}
  @keyframes bounce{0%{transform:scale(1)}35%{transform:scale(1.045,.97) rotate(var(--r,0deg))}100%{transform:scale(1)}}
  #dog.bounce{animation:bounce .18s ease-out}

  /* corações */
  .heart{position:absolute;transform:translate(-50%,-50%) scale(0);font-size:calc(var(--u)*56);line-height:1;
         opacity:0;pointer-events:none;filter:drop-shadow(0 2px 2px #0004)}
  .heart.show{animation:heartIn .35s cubic-bezier(.2,1.8,.4,1) forwards, heartOut 2.2s 1.2s ease-in forwards}
  @keyframes heartIn{from{transform:translate(-50%,-50%) scale(0);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
  @keyframes heartOut{from{opacity:1;transform:translate(-50%,-50%) scale(1)}to{opacity:0;transform:translate(-50%,-80%) scale(1.25)}}

  /* zonas de toque */
  .zone{position:absolute;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;z-index:5;display:none}
  .playing .zone{display:block}

  /* camada dos ícones que caem */
  #fx{position:absolute;inset:0;z-index:6;pointer-events:none}
  .target{position:absolute;transform:translate(-50%,-50%);width:calc(var(--u)*76);height:calc(var(--u)*76);border-radius:50%;
          border:4px dashed var(--c);opacity:0;transition:opacity .5s;background:#fff3}
  .playing .target{opacity:.9;animation:tpulse .9s ease-in-out infinite}
  @keyframes tpulse{50%{transform:translate(-50%,-50%) scale(1.1)}}
  .note{position:absolute;left:0;top:0;width:calc(var(--u)*64);height:calc(var(--u)*64);
        margin:calc(var(--u)*-32) 0 0 calc(var(--u)*-32);will-change:transform}
  .note .core{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
              font-size:calc(var(--u)*32);background:var(--c);box-shadow:0 4px 12px #0005, inset 0 -5px 0 #0002;border:4px solid #fff}
  .note.hit .core{animation:pop .3s ease-out forwards}
  .note.miss .core{filter:grayscale(1);animation:fade .45s ease-in forwards}
  @keyframes pop{to{transform:scale(1.8);opacity:0}}
  @keyframes fade{to{opacity:0}}
  .pop{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:calc(var(--u)*22);z-index:7;pointer-events:none;white-space:nowrap;
       text-shadow:0 2px 0 #fff,0 0 8px #fff,0 3px 6px #0003;animation:rise .75s ease-out forwards}
  @keyframes rise{from{opacity:1;transform:translate(-50%,-50%)}to{opacity:0;transform:translate(-50%,-220%)}}

  /* HUD na parte de baixo da tela */
  #hud{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));
       width:min(640px,94vw);display:none;align-items:center;gap:10px;z-index:12;pointer-events:none}
  .playing #hud{display:flex}
  .chip{background:#fffe;border:3px solid #fff;border-radius:18px;padding:6px 14px;font-weight:900;box-shadow:0 4px 0 #ff5d8f33;font-size:22px;min-width:96px;line-height:1.1}
  .chip small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
  #combo{color:var(--pink);text-align:right}
  #bar{flex:1;height:16px;border-radius:10px;background:#fffb;border:3px solid #fff;overflow:hidden;box-shadow:0 3px 0 #ff5d8f33}
  #bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff5d8f,#ffc531)}

  /* reações estilo Instagram (sobem da parte de baixo) */
  #reactions{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden}
  .react{position:absolute;bottom:-70px;line-height:1;will-change:transform,opacity;filter:drop-shadow(0 3px 3px #0003)}

  /* caixa de diálogo estilo visual novel */
  #dialog{
    position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    width:min(640px,94vw);min-height:130px;padding:26px 24px 18px;
    background:linear-gradient(#fff,#fff0f5);border:4px solid #fff;border-radius:22px;
    box-shadow:0 0 0 3px var(--pink),0 12px 30px #0004;z-index:20;transition:opacity .5s, transform .5s;
  }
  #dialog.gone{opacity:0;transform:translate(-50%,40px);pointer-events:none}
  #nameplate{position:absolute;top:-18px;left:22px;background:var(--pink);color:#fff;font-weight:900;padding:4px 18px;border-radius:14px;
             border:3px solid #fff;letter-spacing:.06em;box-shadow:0 4px 0 #0002}
  #text{font-size:clamp(20px,4.6vw,28px);font-weight:700;line-height:1.3;min-height:2.6em}
  #cursor{display:inline-block;width:.5em;animation:blink .7s steps(1) infinite;color:var(--pink)}
  @keyframes blink{50%{opacity:0}}
  #go{
    display:none;margin:10px 0 0 auto;font:inherit;font-weight:900;font-size:22px;letter-spacing:.04em;
    padding:10px 34px;border-radius:999px;border:3px solid #fff;color:#fff;background:var(--pink);
    box-shadow:0 6px 0 #c93a6b;cursor:pointer;animation:wob 1s ease-in-out infinite;
  }
  #go:active{transform:translateY(4px);box-shadow:0 2px 0 #c93a6b;animation:none}
  @keyframes wob{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

  /* tela de resultado */
  #result{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#4a2a3a99;z-index:30;backdrop-filter:blur(3px)}
  #result .card{background:#fff;border-radius:26px;padding:28px 34px;text-align:center;box-shadow:0 0 0 4px var(--pink),0 16px 40px #0005;max-width:90vw}
  #result h2{margin:0 0 6px;font-size:30px;color:var(--pink)}
  #result p{margin:6px 0;font-size:20px;font-weight:700}
  #result button{margin-top:14px;font:inherit;font-weight:900;font-size:20px;padding:10px 30px;border-radius:999px;border:3px solid #fff;color:#fff;background:var(--pink);box-shadow:0 6px 0 #c93a6b;cursor:pointer}
  #start-hint{position:fixed;top:12px;left:0;right:0;text-align:center;font-weight:700;opacity:.6;font-size:14px;z-index:3}
</style>
</head>

    <h2 id="rtitle">Fim!</h2>

    <p id="racc"></p>
    <p id="rmax"></p>

  </div>
</div>

<script>
(() => {
  /* ---------- geometria (em pixels da imagem recortada 375x431) ---------- */
  const IMG_W = 375, IMG_H = 431;
  const P = {
    eyeL:  [150, 68],
    eyeR:  [233, 62],
    tongue:[198, 203],
    earL:  [85, 75],     // orelha à esquerda na tela
    earR:  [315, 60]     // orelha à direita na tela
  };
  const TARGETS = {
    T: {pos:P.tongue, r:62, color:'#ff5d8f', icon:'👅', name:'língua'},
    L: {pos:P.earL,   r:68, color:'#5ab8ff', icon:'👂', name:'orelha esquerda'},
    R: {pos:P.earR,   r:68, color:'#ffc531', icon:'👂', name:'orelha direita'}
  };

  const stage = document.getElementById('stage');
  const wrap  = document.getElementById('wrap');
  const dog   = document.getElementById('dog');
  const $ = id => document.getElementById(id);

  function setUnit(){ stage.style.setProperty('--u', (stage.clientWidth/375).toFixed(4)+'px'); }
  setUnit(); addEventListener('resize', setUnit);

  const pct = ([x,y]) => ({l:(x/IMG_W*100)+'%', t:(y/IMG_H*100)+'%'});

  /* corações nos olhos */
  const hearts = [P.eyeL,P.eyeR].map(p=>{
    const h=document.createElement('div'); h.className='heart'; h.textContent='❤️';
    const q=pct(p); h.style.left=q.l; h.style.top=q.t; wrap.appendChild(h); return h;
  });

  /* zonas de toque */
  const zones = {};
  for (const k in TARGETS){
    const T=TARGETS[k], z=document.createElement('div'); z.className='zone';
    const q=pct(T.pos); z.style.left=q.l; z.style.top=q.t;
    z.style.width=(T.r*2/IMG_W*100)+'%'; z.style.height=(T.r*2/IMG_W*100*IMG_W/IMG_H)+'%';
    z.style.aspectRatio='1/1'; z.style.height='auto';
    z.addEventListener('pointerdown', e=>{ e.preventDefault(); tap(k); });
    wrap.appendChild(z); zones[k]=z;
  }

  /* camada de efeitos + marcadores dos pontos de toque */
  const fx = $('fx');
  for (const k in TARGETS){
    const m=document.createElement('div'); m.className='target'; m.style.setProperty('--c',TARGETS[k].color);
    const q=pct(TARGETS[k].pos); m.style.left=q.l; m.style.top=q.t; fx.appendChild(m);
  }

  /* ---------- áudio (tudo sintetizado, sem arquivos externos) ---------- */
  let ac, master, musicBus, sfxBus, noiseBuf;
  function initAudio(){
    if (ac) { if (ac.state==='suspended') ac.resume(); return; }
    ac = new (window.AudioContext||window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value=.9;
    const comp = ac.createDynamicsCompressor(); master.connect(comp); comp.connect(ac.destination);
    musicBus = ac.createGain(); musicBus.gain.value=.5; musicBus.connect(master);
    sfxBus = ac.createGain(); sfxBus.gain.value=1; sfxBus.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  const mtof = m => 440*Math.pow(2,(m-69)/12);

  function tone(type, freq, t, dur, vol, bus, freqEnd){
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t+dur+0.05);
  }
  function noise(t, dur, vol, bus, filterType, freq, q){
    const s=ac.createBufferSource(); s.buffer=noiseBuf;
    const f=ac.createBiquadFilter(); f.type=filterType; f.frequency.value=freq; f.Q.value=q||1;
    const g=ac.createGain();
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(bus); s.start(t,Math.random()*.5); s.stop(t+dur+0.05);
  }

  /* batidas ao acertar */
  function sfxHit(k, t){
    t = t || ac.currentTime;
    if (k==='T'){        // língua: bumbo/tom grave
      tone('sine',220,t,.22,1,sfxBus,60); noise(t,.04,.4,sfxBus,'lowpass',1500);
      tone('triangle',440,t,.08,.25,sfxBus,200);
    } else if (k==='L'){ // orelha esquerda: caixa
      tone('triangle',200,t,.12,.6,sfxBus,120); noise(t,.16,.7,sfxBus,'highpass',1800);
    } else {             // orelha direita: palma / bloco
      noise(t,.03,.8,sfxBus,'bandpass',1500,2); noise(t+.012,.03,.7,sfxBus,'bandpass',1500,2);
      noise(t+.026,.12,.6,sfxBus,'bandpass',1300,1.5); tone('square',880,t,.05,.15,sfxBus,660);
    }
  }
  /* som de erro */
  function sfxError(){
    const t=ac.currentTime;
    tone('sawtooth',170,t,.28,.45,sfxBus,70);
    tone('square',120,t+.02,.28,.25,sfxBus,55);
  }
  function sfxBlip(){ // som do texto sendo digitado
    if(!ac) return; tone('square',700+Math.random()*120,ac.currentTime,.04,.05,sfxBus);
  }

  /* música de fundo (agendada com antecedência) */
  const BPM = 104, BEAT = 60/BPM, STEP = BEAT/2;       // passo = colcheia
  const PROG = [
    {bass:36, arp:[60,64,67,72]},   // C
    {bass:33, arp:[57,60,64,69]},   // Am
    {bass:29, arp:[57,60,65,69]},   // F
    {bass:31, arp:[59,62,67,71]}    // G
  ];
  const MEL = [
    [76,0,79,0,76,0,72,0],
    [76,0,72,0,69,0,72,0],
    [77,0,72,0,69,0,72,0],
    [74,0,71,0,74,0,79,0]
  ];
  const ARP_IDX=[0,1,2,3,2,1,2,3];
  const INTRO_BARS=2, CHART_BARS=16, TOTAL_BARS=INTRO_BARS+CHART_BARS+1;

  function scheduleStep(i, t){
    const bar=Math.floor(i/8), s=i%8, ch=PROG[bar%4];
    if (bar>=TOTAL_BARS) return;
    const last = bar===TOTAL_BARS-1;
    if (last){ if(s===0){ [48,52,55,60,64].forEach(m=>tone('triangle',mtof(m),t,1.8,.18,musicBus)); tone('sine',mtof(36),t,1.8,.4,musicBus);} return; }
    // baixo
    if (s===0||s===3||s===4) tone('sine',mtof(ch.bass),t,STEP*1.8,.5,musicBus);
    // arpejo
    tone('triangle',mtof(ch.arp[ARP_IDX[s]]),t,STEP*1.4,.17,musicBus);
    // melodia
    const m=MEL[bar%4][s]; if(m) tone('sine',mtof(m),t,STEP*2.2,.16,musicBus);
    // percussão leve
    if (s%2===0) noise(t,.03,.07,musicBus,'highpass',7000); else noise(t,.05,.12,musicBus,'highpass',7000);
    if (s===0||s===4) tone('sine',120,t,.12,.35,musicBus,45);
  }

  /* ---------- fase (gráfico das notas) ---------- */
  const BARS = [
    "T...L...","R...T...","L...R...","T...T...",
    "T.L.R.T.","L.R.T.R.","T.L.T.R.","L...R.T.",
    "TL.R.TL.","R.LT.R.L","T.LR.TL.","RT.L.R.T",
    "TLRTLRTL","R.T.L.R.","TLR.TLR.","T...L..R"
  ];
  const FALL_TIME = 1.7;               // segundos para atravessar a altura da tela
  const WIN = {perfect:.08, good:.16, ok:.27};

  let t0=0, notes=[], nextStep=0, schedTimer=null, raf=0, running=false;
  let score=0, combo=0, maxCombo=0, hits=0, total=0, perfects=0;

  function buildNotes(){
    notes=[];
    BARS.forEach((bar,bi)=>{
      [...bar].forEach((c,si)=>{
        if (c==='.') return;
        const slot=(INTRO_BARS+bi)*8+si;
        notes.push({k:c, time:t0+slot*STEP, el:null, done:false, spawned:false});
      });
    });
    total=notes.length;
  }

  function startGame(){
    score=0;combo=0;maxCombo=0;hits=0;perfects=0;
    updHud();
    t0=ac.currentTime+0.4; buildNotes(); nextStep=0;
    document.body.classList.add('playing');
    wrap.className='idle';
    running=true;
    const pump=()=>{
      while (nextStep<TOTAL_BARS*8 && t0+nextStep*STEP < ac.currentTime+0.25){
        scheduleStep(nextStep, t0+nextStep*STEP); nextStep++;
      }
    };
    pump(); schedTimer=setInterval(pump,40);
    raf=requestAnimationFrame(loop);
  }

  function loop(){
    if(!running) return;
    const now=ac.currentTime;
    const sc=stage.clientWidth/IMG_W;
    const speed=innerHeight/FALL_TIME;                 // px/s (velocidade constante)
    const stageTop=stage.getBoundingClientRect().top;
    const startY=-stageTop-50*sc;                      // um pouco acima do topo da tela
    for (const n of notes){
      if (n.done) continue;
      const T=TARGETS[n.k], tx=T.pos[0]*sc, ty=T.pos[1]*sc;
      if (!n.spawned && now>=n.time-(ty-startY)/speed){ spawn(n); }
      if (n.spawned){
        n.x=tx; n.y=ty-(n.time-now)*speed;             // passa por cima do ponto na hora exata
        n.el.style.transform='translate('+n.x+'px,'+n.y+'px)';
      }
      if (now>n.time+WIN.ok){ judgeMiss(n); }
    }
    const lastT=notes[notes.length-1].time;
    $('barfill').style.width=Math.min(100,Math.max(0,(now-t0)/(lastT+STEP*4-t0)*100))+'%';
    if (now>lastT+2.2){ return finish(); }
    raf=requestAnimationFrame(loop);
  }

  function spawn(n){
    const T=TARGETS[n.k], el=document.createElement('div'); el.className='note';
    el.style.setProperty('--c',T.color);
    const core=document.createElement('div'); core.className='core'; core.textContent=T.icon;
    if (n.k==='R') core.style.transform='scaleX(-1)';
    el.appendChild(core); fx.appendChild(el);
    n.el=el; n.spawned=true;
  }

  function popText(k, txt, color){
    const el=document.createElement('div'); el.className='pop'; el.textContent=txt; el.style.color=color;
    const q=pct(TARGETS[k].pos); el.style.left=q.l; el.style.top=q.t; fx.appendChild(el);
    setTimeout(()=>el.remove(),800);
  }

  /* corações e tulipas subindo da parte de baixo da tela, como reações do Instagram */
  function reactions(count){
    const layer=$('reactions'), W=innerWidth, H=innerHeight;
    const EMO=['🌷','❤️','🌷','💖','🌷','❤️'];
    for (let i=0;i<count;i++){
      const el=document.createElement('div'); el.className='react';
      el.textContent=EMO[Math.floor(Math.random()*EMO.length)];
      el.style.fontSize=(26+Math.random()*28)+'px';
      el.style.left=(W*(0.12+Math.random()*0.76))+'px';
      const rise=H*(0.5+Math.random()*0.4), amp=18+Math.random()*40, dir=Math.random()<.5?-1:1;
      const s=0.8+Math.random()*0.5, rot=(Math.random()*30-15);
      const a=el.animate([
        {transform:'translate(0,0) scale(.3) rotate(0deg)',opacity:0},
        {transform:'translate(0,'+(-rise*.08)+'px) scale('+s+') rotate('+rot*.3+'deg)',opacity:1,offset:.12},
        {transform:'translate('+(dir*amp)+'px,'+(-rise*.4)+'px) scale('+s+') rotate('+rot+'deg)',opacity:1,offset:.4},
        {transform:'translate('+(-dir*amp)+'px,'+(-rise*.7)+'px) scale('+s*.95+') rotate('+(-rot)+'deg)',opacity:.9,offset:.7},
        {transform:'translate('+(dir*amp*.6)+'px,'+(-rise)+'px) scale('+s*.8+') rotate(0deg)',opacity:0}
      ],{duration:1900+Math.random()*1300,delay:Math.random()*220,easing:'ease-out',fill:'both'});
      a.onfinish=()=>el.remove();
      layer.appendChild(el);
    }
  }

  function bounce(k){
    dog.style.setProperty('--r', k==='L'?'-2deg':k==='R'?'2deg':'0deg');
    dog.classList.remove('bounce'); void dog.offsetWidth; dog.classList.add('bounce');
  }

  function tap(k){
    if(!running) return;
    const now=ac.currentTime;
    let best=null, bd=1e9;
    for (const n of notes){
      if (n.done||n.k!==k||!n.spawned) continue;
      const d=Math.abs(n.time-now);
      if (d<bd){bd=d;best=n;}
    }
    if (best && bd<=WIN.ok){
      best.done=true; best.el.classList.add('hit'); const el=best.el; setTimeout(()=>el.remove(),320);
      sfxHit(k); bounce(k); hits++;
      let txt,pts,col;
      if (bd<=WIN.perfect){txt='Perfeito!';pts=300;col='#ff3d7a';perfects++;}
      else if (bd<=WIN.good){txt='Bom!';pts=200;col='#2a9d8f';}
      else {txt='Ok';pts=100;col='#6a5acd';}
      combo++; maxCombo=Math.max(maxCombo,combo);
      score+=pts+Math.min(combo,30)*5;
      popText(k,txt,col); updHud();
      reactions(pts===300?4:pts===200?3:2);
      if (combo%10===0) reactions(10);
    } else {
      sfxError(); combo=0; popText(k,'Errou!','#555'); updHud();
    }
  }

  function judgeMiss(n){
    n.done=true; sfxError(); combo=0; updHud();
    if (n.el){ n.el.classList.add('miss'); const el=n.el; setTimeout(()=>el.remove(),480); }
    popText(n.k,'Perdeu','#777');
  }

  function updHud(){ $('score').textContent=score; $('comboN').textContent=combo; }

  function finish(){
    running=false; clearInterval(schedTimer);
    document.body.classList.remove('playing');
    const acc=Math.round(hits/total*100);
    const title = acc>=90?'Que ritmo incrível! 🐶💖':acc>=70?'Muito bem! 🎉':acc>=40?'Boa tentativa! 🐾':'Vamos treinar mais? 🦴';
    $('rtitle').textContent=title;
    $('rscore').textContent='Pontos: '+score;
    $('racc').textContent='Acertos: '+hits+' de '+total+' ('+acc+'%)';
    $('rmax').textContent='Maior combo: '+maxCombo;
    $('result').style.display='flex';
  }

  $('again').addEventListener('click',()=>{
    $('result').style.display='none';
    document.querySelectorAll('.note,.pop,.react').forEach(e=>e.remove());
    startGame();
  });

  /* ---------- introdução: texto digitado + dog mexendo ---------- */
  const LINE = "oi, meu nome é tulipa, vamos brincar?";
  const typed=$('typed'), goBtn=$('go');
  let ci=0;
  wrap.className='talk';
  function typeNext(){
    if (ci<LINE.length){
      const ch=LINE[ci++]; typed.textContent+=ch;
      if (ch!==' ') sfxBlip();
      const delay = ch===','?330 : ch==='?'?0 : 55+Math.random()*35;
      setTimeout(typeNext, delay);
    } else {
      wrap.className='idle';
      $('cursor').textContent='▼';
      goBtn.style.display='block';
    }
  }
  setTimeout(typeNext, 700);

  goBtn.addEventListener('click',()=>{
    initAudio();
    goBtn.style.display='none'; goBtn.style.animation='none';
    hearts.forEach(h=>{h.classList.remove('show'); void h.offsetWidth; h.classList.add('show');});
    // um som fofinho
    const t=ac.currentTime; tone('sine',880,t,.15,.25,sfxBus); tone('sine',1320,t+.1,.25,.25,sfxBus);
    setTimeout(()=>$('dialog').classList.add('gone'),900);
    setTimeout(startGame, 3200);        // começa depois que os corações somem
  });

  // desbloqueia áudio no primeiro toque em qualquer lugar (sons de digitação)
  addEventListener('pointerdown',()=>{ try{initAudio();}catch(e){} },{once:true});
})();
</script>
